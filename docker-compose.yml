services:
  postgres:
    image: postgres:17
    container_name: kunirank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kunirank
      POSTGRES_USER: kunirank
      POSTGRES_PASSWORD: kunirank_local_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
